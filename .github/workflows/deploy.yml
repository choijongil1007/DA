name: Deploy Deal Architect to GitHub Pages

on:
  push:
    branches: [ "main" ]

# 권한 설정: GitHub Pages에 배포하기 위해 쓰기 권한이 필요함
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GitHub Pages는 도메인 뒤에 /repository-name/이 붙는 경우가 많으므로 base 경로 확인 필요
        run: npm run build

      # 핵심: dist 폴더를 gh-pages 브랜치로 배포
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite 빌드 결과물 폴더
          branch: gh-pages # 배포용 브랜치
