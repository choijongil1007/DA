name: Deploy Deal Architect to GitHub Pages

on:
  push:
    branches: [ "main" ]

# 권한 설정: GitHub Pages에 배포하기 위해 쓰기 권한이 필요함
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm' <- 이 줄을 삭제하여 package-lock.json 미검출 에러를 방지합니다.

      - name: Install dependencies
        # package-lock.json이 없으므로 npm install을 사용하여 필요한 패키지를 새로 설치합니다.
        run: npm install

      - name: Build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      # 핵심: dist 폴더를 gh-pages 브랜치로 배포
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite 빌드 결과물 폴더
          branch: gh-pages # 배포용 브랜치
